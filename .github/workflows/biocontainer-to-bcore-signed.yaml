name: Retag and Sign BioContainer Images
# Triggered on release.json changes (new tool version) or manually.
# On push: only processes the tools whose release.json changed.
# On workflow_dispatch: processes all tools by default, or changed-only if selected.
on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "Retag scope: all tools or only recently changed"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - changed-only
  push:
    branches:
      - main
    paths:
      - "bfx/*/release.json" # Only trigger when a tool version is added/updated

jobs:
  retag-sign:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # Needed to diff against the previous commit

      - name: Set up jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and sign images
        env:
          GHCR_ORG: ${{ github.repository_owner }}
          BCORE_AUTH_TOKEN: ${{ secrets.BCORE_AUTH_TOKEN_PROD }}
          PROD_DOMAIN: bfx
        run: |
          set -e

          EVENT="${{ github.event_name }}"
          SCAN_MODE="${{ github.event.inputs.scan_mode }}"

          # ── Determine which tool directories to process ──────────────────────
          if [ "$EVENT" = "push" ] || { [ "$EVENT" = "workflow_dispatch" ] && [ "$SCAN_MODE" = "changed-only" ]; }; then
            echo "🔍 Incremental mode — diffing bfx/ against previous commit..."
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- bfx/ 2>/dev/null || true)

            if [ -z "$CHANGED_FILES" ]; then
              echo "  → No changes detected in bfx/ — nothing to retag"
              exit 0
            fi

            echo "Changed files:"
            echo "$CHANGED_FILES" | sed 's/^/  - /'

            # Extract unique tool dirs from changed paths: bfx/<tool>/release.json → bfx/<tool>/
            TOOL_DIRS=$(echo "$CHANGED_FILES" \
              | grep '^bfx/' \
              | sed 's|^bfx/||' \
              | cut -d'/' -f1 \
              | sort -u \
              | sed 's|^|bfx/|; s|$|/|')

            if [ -z "$TOOL_DIRS" ]; then
              echo "  → No tool-level changes found — nothing to retag"
              exit 0
            fi

            echo ""
            echo "🛠 Tools to retag:"
            echo "$TOOL_DIRS" | sed 's/^/  ✓ /'
          else
            echo "📋 Full mode — retagging ALL tools in bfx/"
            TOOL_DIRS=$(find bfx -mindepth 1 -maxdepth 1 -type d | sort | sed 's|$|/|')
          fi

          # ── Helper: update BundleCore API with new tool version ──────────────
          update_bundlecore_tool_version() {
              local app_name=$1
              local new_version=$2
              local original_image=$3
              local bc_registry_url=$4

              echo "Updating BundleCore API for $app_name version $new_version..."

              local versions_data=$(curl -sS -H "Authorization: Bearer ${BCORE_AUTH_TOKEN}" "https://bundlecore.com/api/tools/${app_name}/versions")

              if [ -z "$versions_data" ]; then
                  echo "⚠️  Warning: Failed to fetch versions for $app_name from BundleCore API" >&2
                  return 0
              fi

              local existing_version=$(echo "$versions_data" | jq -r --arg ver "$new_version" '.data.versions[] | select(.version == $ver)')

              if [ -n "$existing_version" ] && [ "$existing_version" != "null" ]; then
                  local existing_bc_registry=$(echo "$existing_version" | jq -r '.bcRegistryUrl')

                  if [ -n "$existing_bc_registry" ] && [ "$existing_bc_registry" != "" ] && [ "$existing_bc_registry" != "null" ]; then
                      echo "ℹ️  Version $new_version already exists for $app_name with bcRegistryUrl: $existing_bc_registry"
                      return 0
                  fi

                  echo "📝 Version $new_version exists but bcRegistryUrl is empty, updating..."

                  local updated_body=$(echo "$existing_version" | jq \
                      --arg bc_registry "$bc_registry_url" \
                      --arg registry "$original_image" \
                      '.bcRegistryUrl = $bc_registry |
                      .registryUrl = $registry')

                  echo "Updated body: $updated_body"

                  response=$(curl -sS -w "%{http_code}" -o /tmp/curl_response -X PUT \
                      -H "Authorization: Bearer ${BCORE_AUTH_TOKEN}" \
                      -H "Content-Type: application/json" \
                      -d "$updated_body" \
                      "https://bundlecore.com/api/tools/${app_name}/versions/${new_version}")

                  if [ "$response" -ne 200 ]; then
                      echo "⚠️  Warning: Failed to update BundleCore for $app_name. HTTP status: $response" >&2
                      echo "Response body: $(cat /tmp/curl_response)" >&2
                      return 0
                  fi

                  echo "✅ Successfully updated version $new_version for $app_name in BundleCore"
                  echo "   bcRegistryUrl: $bc_registry_url"
                  echo "   registryUrl: $original_image"
                  return 0
              fi

              # Version doesn't exist — create a new one
              echo "➕ Creating new version $new_version for $app_name in BundleCore..."

              local template_body=$(echo "$versions_data" | jq '.data.versions[0]')

              if [ -z "$template_body" ] || [ "$template_body" == "null" ]; then
                  echo "⚠️  Warning: No existing versions found for $app_name to use as template" >&2
                  return 0
              fi

              echo "Using template from version: $(echo "$template_body" | jq -r '.version')"

              local new_body=$(echo "$template_body" | jq \
                  --arg new_ver "$new_version" \
                  --arg bc_registry "$bc_registry_url" \
                  --arg registry "$original_image" \
                  '.version = $new_ver |
                  .bcRegistryUrl = $bc_registry |
                  .registryUrl = $registry')

              echo "New version body: $new_body"

              response=$(curl -sS -w "%{http_code}" -o /tmp/curl_response -X POST \
                  -H "Authorization: Bearer ${BCORE_AUTH_TOKEN}" \
                  -H "Content-Type: application/json" \
                  -d "$new_body" \
                  "https://bundlecore.com/api/tools/${app_name}/versions")

              if [ "$response" -ne 200 ]; then
                  echo "⚠️  Warning: Failed to create version in BundleCore for $app_name. HTTP status: $response" >&2
                  echo "Response body: $(cat /tmp/curl_response)" >&2
                  return 0
              fi

              echo "✅ Successfully created version $new_version for $app_name in BundleCore"
              echo "   bcRegistryUrl: $bc_registry_url"
              echo "   registryUrl: $original_image"
              return 0
          }

          # ── Main retag loop ──────────────────────────────────────────────────
          echo ""
          echo "🚀 Starting retag loop..."
          echo ""

          FAILED_LOG="${RUNNER_TEMP}/failed-images.txt"
          : > "$FAILED_LOG"

          while IFS= read -r appdir <&3; do
            [ -z "$appdir" ] && continue
            app=$(basename "$appdir")
            slug=$(echo "$app" | tr '[:upper:]' '[:lower:]')
            release_json="${appdir}release.json"

            if [ ! -f "$release_json" ]; then
              echo "No release.json for $app, skipping"
              continue
            fi

            images=$(jq -r '.images[]' "$release_json")
            for img in $images; do
                tag="${img##*:}"
                # remove everything after '--' (e.g. '1.21--h3a4d415_1' -> '1.21')
                tag="${tag%%--*}"
                dest="ghcr.io/${GHCR_ORG}/products/${PROD_DOMAIN}/${slug}:${tag}"
                if docker manifest inspect "$dest" > /dev/null 2>&1; then
                  echo "Image $dest already exists, skipping"
                  continue
                fi
                echo "Processing $img -> $dest"

                if ! docker pull "$img"; then
                  echo "❌ docker pull failed for $img — skipping this image" >&2
                  printf '%s\t%s\t%s\t%s\t%s\n' "$slug" "$tag" "$img" "$dest" "docker pull failed" >> "$FAILED_LOG"
                  continue
                fi
                if ! docker tag "$img" "$dest"; then
                  echo "❌ docker tag failed for $img -> $dest — skipping this image" >&2
                  printf '%s\t%s\t%s\t%s\t%s\n' "$slug" "$tag" "$img" "$dest" "docker tag failed" >> "$FAILED_LOG"
                  continue
                fi
                if ! docker push "$dest"; then
                  echo "❌ docker push failed for $dest — skipping this image" >&2
                  printf '%s\t%s\t%s\t%s\t%s\n' "$slug" "$tag" "$img" "$dest" "docker push failed" >> "$FAILED_LOG"
                  continue
                fi
                if ! cosign sign --yes "$dest"; then
                  echo "❌ cosign sign failed for $dest — skipping this image" >&2
                  printf '%s\t%s\t%s\t%s\t%s\n' "$slug" "$tag" "$img" "$dest" "cosign sign failed" >> "$FAILED_LOG"
                  continue
                fi

                # Update BundleCore API with new version
                update_bundlecore_tool_version "$slug" "$tag" "$img" "$dest" || true
            done

            # Clean up local images after each tool to avoid disk bloat
            if docker images -q | grep -q .; then
              echo "Cleaning up docker images and cache..."
              docker images -q | xargs -r -n1 docker rmi -f || true
              docker builder prune -af || true
              docker image prune -af || true
              docker system prune -af --volumes || true
            fi
          done 3<<< "$TOOL_DIRS"

          if [ -s "$FAILED_LOG" ]; then
            echo ""
            echo "⚠️  The following images failed to retag/sign and were skipped:"
            sed 's/^/  - /' "$FAILED_LOG"
            exit 1
          fi

      - name: File issues for failed image pulls
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
        run: |
          FAILED_LOG="${RUNNER_TEMP}/failed-images.txt"

          if [ ! -s "$FAILED_LOG" ]; then
            echo "No failed images to report."
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          while IFS=$'\t' read -r slug tag img dest reason; do
            [ -z "$slug" ] && continue

            echo "Checking for an existing open issue for $img..."
            existing=$(gh issue list --repo "${{ github.repository }}" --state open \
              --search "\"$img\" in:title,body" --json number --jq '.[0].number' 2>/dev/null || true)

            if [ -n "$existing" ] && [ "$existing" != "null" ]; then
              echo "  → Issue #$existing already covers $img, skipping"
              continue
            fi

            echo "  → Creating new issue for $img"
            body=$(printf 'The **Retag and Sign BioContainer Images** workflow failed to retag/sign an image.\n\n- **Tool:** `%s`\n- **Source image:** `%s`\n- **Target:** `%s`\n- **Failure reason:** %s\n- **Workflow run:** %s\n\nOther images for this tool (if any) were retagged normally — only this one failed. The workflow now skips failing images instead of aborting the whole run; this issue tracks the follow-up needed to fix or replace the source image.' \
              "$slug" "$img" "$dest" "$reason" "$RUN_URL")
            issue_url=$(gh issue create --repo "${{ github.repository }}" \
              --title "Retag failed: $img ($reason)" \
              --body "$body")
            echo "  ✓ Created $issue_url"
            issue_number="${issue_url##*/}"
            gh issue edit "$issue_number" --repo "${{ github.repository }}" --add-label "bug" 2>/dev/null \
              && echo "    ✓ Added label bug" || echo "    ⚠ Could not add label bug (missing permissions or label doesn't exist)"
            gh issue edit "$issue_number" --repo "${{ github.repository }}" --add-label "retag-failure" 2>/dev/null \
              && echo "    ✓ Added label retag-failure" || echo "    ⚠ Could not add label retag-failure (missing permissions or label doesn't exist)"
          done < "$FAILED_LOG"
